<div class="home-container">
  <div class="sidebar-left">
    <div class="logo">
      <img src="../../../../assets/images/StarcordBannerTransparent.png" alt="logo">
    </div>

    <div class="divider"></div>

    <div class="direct-messages-div">
      <p>Direct Messages</p>
      <img id="add-star" src="../../../../assets/svgs/four-point-star.svg" alt="add" />
    </div>

    <div class="sidebar-users">
      <app-sidebar-user></app-sidebar-user>
    </div>

    <div class="divider"></div>

    <div class="sidebar-footer">
      <div class="footer-item">
        <lucide-icon name="users" [size]="18"></lucide-icon>
        <span>Friends</span>
      </div>
      <div class="footer-item">
        <lucide-icon name="settings" [size]="18"></lucide-icon>
        <span>Settings</span>
      </div>
      <div class="footer-item logout">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
        <span>Log out</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="message-content">
      <router-outlet></router-outlet>
    </div>

    <div class="message-sending">
      <div class="input-wrapper">
        <button class="add-button">
          <lucide-icon name="plus" [size]="14"></lucide-icon>
        </button>

        <textarea
          #messageInput
          placeholder="Message this chat"
          rows="1"
          (input)="adjustHeight(messageInput)"
          (keydown.enter)="$any($event).shiftKey ? null : handleSend($event, messageInput)"
        ></textarea>

        <button class="send-button" (click)="handleSend($event, messageInput)">
          <lucide-icon name="send-horizontal" [size]="18"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="sidebar-right"></div>
</div>
