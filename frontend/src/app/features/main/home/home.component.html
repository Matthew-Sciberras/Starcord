<div class="home-container">
  <div class="sidebar-left">
    <div class="logo">
      <img src="../../../../assets/images/StarcordBannerTransparent.png" alt="logo">
    </div>

    <div class="divider"></div>

    <div class="direct-messages-div">
      <p>Direct Messages</p>
      <img id="add-star" src="../../../../assets/svgs/four-point-star.svg" alt="add" />
    </div>

    <div class="sidebar-users">
      <app-sidebar-user></app-sidebar-user>
    </div>

    <div class="sidebar-footer">
      <div class="footer-top-actions">
        <div class="footer-item">
          <lucide-icon name="users" [size]="18"></lucide-icon>
          <span>Friends</span>
        </div>
      </div>

      <div class="user-control-bar" *ngIf="userProfile">
        <div class="user-info-section">
          <div class="avatar-wrapper">
            <img [src]="userProfile.profilePicture" alt="avatar">
            <div class="status-indicator"></div>
          </div>
          <div class="user-text">
            <span class="username">{{ userProfile.username }}</span>
            <span class="status-text">Online</span>
          </div>
        </div>

        <div class="user-actions">
          <button class="action-btn" title="Settings">
            <lucide-icon name="settings" [size]="16"></lucide-icon>
          </button>
          <button class="action-btn logout" title="Log out">
            <lucide-icon name="log-out" [size]="16"></lucide-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="message-content">
      <router-outlet></router-outlet>
    </div>

    <div class="message-sending">
      <div class="input-wrapper">
        <button class="add-button">
          <lucide-icon name="plus" [size]="16"></lucide-icon>
        </button>

        <textarea
          #messageInput
          placeholder="Message this chat"
          rows="1"
          (input)="adjustHeight(messageInput)"
          (keydown.enter)="$any($event).shiftKey ? null : handleSend($event, messageInput)"
        ></textarea>

        <button class="send-button" (click)="handleSend($event, messageInput)">
          <lucide-icon name="send-horizontal" [size]="18"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="sidebar-right"></div>
</div>
