<div class="main">
  @for (person of contacts; track person.channelID) {
    <div class="contact-row">
      <img [src]="person.avatarUrl || 'assets/images/pfp_christmas.png'" alt="avatar" id="avatar">
      <div class="info">
        <div class="name">{{ person.name }}</div>
        <div class="status">{{ person.status || ''}}</div>
      </div>
    </div>
  } @empty {
    <div>No contacts found!</div>
  }
</div>
